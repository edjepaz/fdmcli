[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdmcli"
version = "0.6.0"
description = "Command-line control for Elegoo network 3D printers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ed Paz" }]
dependencies = ["websocket-client>=1.8.0"]
optional-dependencies.test = ["pytest>=8.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
fdm = "fdmcli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fdmcli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
